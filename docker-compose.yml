services:
  app:
    build: .
    ports: ["8080:80"]
    env_file: .env
    volumes: [".:/var/www/html"]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-chezvous}
      MYSQL_USER: ${DB_USERNAME:-chezvous}
      MYSQL_PASSWORD: ${DB_PASSWORD:-chezvous_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql", "./database:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
